<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yt-mirror V1 design: 3. Add channel, step 1: link</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8DB8FF}a:hover{color:#E8EBF0}
</style>
</head>
<body>
<div style="display:flex;justify-content:center;padding:24px;background:#000"><div style="width: 640px; box-sizing: border-box; padding: 32px; background: #07080A; color: #E8EBF0; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; display: flex; align-items: flex-start; justify-content: center">
<div role="dialog" aria-label="Add a channel" style="width: 100%; box-sizing: border-box; border-radius: 16px; background: #161A21; border: 1px solid #323A47; display: flex; flex-direction: column">
<div style="display: flex; align-items: flex-start; gap: 12px; padding: 22px 24px 14px"><div style="flex: 1"><h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 22px; ">Add a channel</h2></div><button aria-label="Close" title="Close" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: #9BA4B3; cursor: pointer; flex: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button></div>
<div style="padding: 4px 24px 20px; display: flex; flex-direction: column; gap: 18px"><div><div style="margin-bottom: 6px; font-weight: 500">Channel link or @handle</div><input type="text" aria-label="Channel link" value="https://www.youtube.com/@samplechannelthree" placeholder="" style="min-height: 44px; width: 100%; box-sizing: border-box; padding: 0 12px; border: 1px solid #323A47; border-radius: 8px; background: #161A21; color: #E8EBF0; font: inherit"><div style="margin-top: 6px; font-size: 13px; color: #9BA4B3">Regular videos are mirrored. Shorts and live streams are skipped in this version.</div></div><div role="status" style="display: flex; align-items: center; gap: 8px; color: #C6CCD6"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M20 12a8 8 0 1 1-2.3-5.7"></path><path d="M20 4v5h-5"></path></svg>Looking up the channel...</div></div>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid #262C36"><button style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 8px; font: inherit; cursor: pointer; white-space: nowrap; border: 0; background: transparent; color: #9BA4B3; ">Cancel</button><button style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 8px; font: inherit; cursor: pointer; white-space: nowrap; border: 0; background: #5B9BFF; color: #0B1220; font-weight: 600; opacity: 0.5">Continue</button></div>
</div></div></div>
</body>
</html>
