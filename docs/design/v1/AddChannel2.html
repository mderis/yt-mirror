ll="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="12" cy="12" r="8"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg><div style="flex: 1">This folder already contains 42 video files. After adding, you can match them to the channel instead of downloading again.</div></div><div><div style="margin-bottom: 6px; font-weight: 500">Quality</div><select aria-label="Quality" style="min-height: 44px; width: 100%; padding: 0 12px; border: 1px solid #323A47; border-radius: 8px; background: #161A21; color: #E8EBF0; font: inherit"><option>Use default (Best available)</option><option>2160p (4K)</option><option>1440p</option><option>1080p</option><option>720p</option><option>480p</option></select></div><div><div style="margin-bottom: 6px; font-weight: 500">What to mirror</div><div role="radiogroup" aria-label="What to mirror"><label style="display: flex; align-items: flex-start; gap: 12px; min-height: 44px; padding: 6px 0; box-sizing: border-box; cursor: pointer"><input type="radio" name="m" checked style="width: 18px; height: 18px; margin-top: 2px; accent-color: #5B9BFF; flex: none"><span><span style="display: block">Let me pick videos myself</span><span style="display: block; font-size: 13px; color: #9BA4B3">Nothing downloads until you select videos.</span></span></label><label style="display: flex; align-items: flex-start; gap: 12px; min-height: 44px; padding: 6px 0; box-sizing: border-box; cursor: pointer"><input type="radio" name="m" style="width: 18px; height: 18px; margin-top: 2px; accent-color: #5B9BFF; flex: none"><span><span style="display: block">Mirror everything and keep it in sync (auto-mirror)</span><span style="display: block; font-size: 13px; color: #9BA4B3">All 57 videos now, and new ones as they appear.</span></span></label><label style="display: flex; align-items: flex-start; gap: 12px; min-height: 44px; padding: 6px 0; box-sizing: border-box; cursor: pointer"><input
