<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yt-mirror V1 design: 8. Uninstall</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8DB8FF}a:hover{color:#E8EBF0}
</style>
</head>
<body>
<div style="display:flex;justify-content:center;padding:24px;background:#000"><div style="width: 640px; box-sizing: border-box; padding: 32px; background: #07080A; color: #E8EBF0; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; display: flex; align-items: flex-start; justify-content: center">
<div role="dialog" aria-label="Uninstall yt-mirror?" style="width: 100%; box-sizing: border-box; border-radius: 16px; background: #161A21; border: 1px solid #323A47; display: flex; flex-direction: column">
<div style="display: flex; align-items: flex-start; gap: 12px; padding: 22px 24px 14px"><div style="flex: 1"><h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 22px; ">Uninstall yt-mirror?</h2></div><button aria-label="Close" title="Close" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: #9BA4B3; cursor: pointer; flex: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button></div>
<div style="padding: 4px 24px 20px; display: flex; flex-direction: column; gap: 18px"><div>This removes the app, its tools (ffmpeg, Deno, yt-dlp) and the yt-mirror icon from Applications.</div><div role="status" style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 10px; background: #1B2A44; color: #A9C9FF"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="12" cy="12" r="8"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg><div style="flex: 1">Your downloaded videos are never deleted. They stay in ~/Movies/YouTube and in any custom channel folders.</div></div><div><div style="margin-bottom: 6px; font-weight: 500">Your yt-mirror data (channel list, exclude lists, settings, logs)</div><div role="radiogroup" aria-label="data"><label style="display: flex; align-items: flex-start; gap: 12px; min-height: 44px; padding: 6px 0; box-sizing: border-box; cursor: pointer"><input type="radio" name="data" checked style="width: 18px; height: 18px; margin-top: 2px; accent-color: #5B9BFF; flex: none"><span><span style="display: block">Keep it</span><span style="display: block; font-size: 13px; color: #9BA4B3">If you install yt-mirror again, everything is back as you left it.</span></span></label><label style="display: flex; align-items: flex-start; gap: 12px; min-height: 44px; padding: 6px 0; box-sizing: border-box; cursor: pointer"><input type="radio" name="data" style="width: 18px; height: 18px; margin-top: 2px; accent-color: #5B9BFF; flex: none"><span><span style="display: block">Remove it too</span><span style="display: block; font-size: 13px; color: #9BA4B3">Moved to the Trash.</span></span></label></div></div></div>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid #262C36"><button style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 8px; font: inherit; cursor: pointer; white-space: nowrap; border: 0; background: transparent; color: #9BA4B3; ">Cancel</button><button style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 8px; font: inherit; cursor: pointer; white-space: nowrap; border: 1px solid #FFA39B; background: transparent; color: #FFA39B; "><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M5 7h14"></path><path d="M10 7V5h4v2"></path><path d="M7 7l1 12h8l1-12"></path></svg>Uninstall</button></div>
</div></div></div>
</body>
</html>
