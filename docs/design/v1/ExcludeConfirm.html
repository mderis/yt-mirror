<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yt-mirror V1 design: 3. Exclude a downloaded video</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8DB8FF}a:hover{color:#E8EBF0}
</style>
</head>
<body>
<div style="display:flex;justify-content:center;padding:24px;background:#000"><div style="width: 600px; box-sizing: border-box; padding: 32px; background: #07080A; color: #E8EBF0; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; display: flex; align-items: flex-start; justify-content: center">
<div role="dialog" aria-label="Exclude this video forever?" style="width: 100%; box-sizing: border-box; border-radius: 16px; background: #161A21; border: 1px solid #323A47; display: flex; flex-direction: column">
<div style="display: flex; align-items: flex-start; gap: 12px; padding: 22px 24px 14px"><div style="flex: 1"><h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 22px; ">Exclude this video forever?</h2></div><button aria-label="Close" title="Close" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: #9BA4B3; cursor: pointer; flex: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button></div>
<div style="padding: 4px 24px 20px; display: flex; flex-direction: column; gap: 18px"><div>"How I organize my workshop" will be hidden from mirroring and never downloaded again. You can restore it from the Excluded tab.</div><div><div style="margin-bottom: 6px; font-weight: 500">It is already downloaded (412 MB). What should happen to the file?</div><div role="radiogroup" aria-label="file"><label style="display: flex; align-items: flex-start; gap: 12px; min-height: 44px; padding: 6px 0; box-sizing: border-box; cursor: pointer"><input type="radio" name="file" checked style="width: 18px; height: 18px; margin-top: 2px; accent-color: #5B9BFF; flex: none"><span><span style="display: block">Keep the file</span></span></label><label style="display: flex; align-items: flex-start; gap: 12px; min-height: 44px; padding: 6px 0; box-sizing: border-box; cursor: pointer"><input type="radio" name="file" style="width: 18px; height: 18px; margin-top: 2px; accent-color: #5B9BFF; flex: none"><span><span style="display: block">Delete the file</span></span></label></div></div><label style="display: flex; align-items: flex-start; gap: 12px; min-height: 44px; padding: 6px 0; box-sizing: border-box; cursor: pointer"><input type="checkbox" style="width: 18px; height: 18px; margin-top: 2px; accent-color: #5B9BFF; flex: none"><span><span style="display: block">Remember my choice and do not ask again</span><span style="display: block; font-size: 13px; color: #9BA4B3">You can change this in Settings.</span></span></label></div>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid #262C36"><button style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 8px; font: inherit; cursor: pointer; white-space: nowrap; border: 0; background: transparent; color: #9BA4B3; ">Cancel</button><button style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 8px; font: inherit; cursor: pointer; white-space: nowrap; border: 0; background: #5B9BFF; color: #0B1220; font-weight: 600; ">Exclude</button></div>
</div></div></div>
</body>
</html>
