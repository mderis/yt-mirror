# Temporary: runs point (d) of open question Q-24, the quit path, on macOS 15,
# which only the hosted runners have. Removed again once it has run.
name: Q-24 experiment

on:
  push:
    branches: [m1-toolchain-and-app-identity]
    paths:
      - .github/q24-experiment/**
      - .github/workflows/q24-experiment.yml

permissions:
  contents: read

env:
  # The same Python as ./start uses: the one uv manages, never one found on the runner.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  quit:
    name: Q-24 (d) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
      - name: Install Python and the app's packages
        run: uv sync --frozen --no-dev
      - name: Every way of quitting the test app
        env:
          Q24_REAL_KEYS: "1"
        run: |
          site=$(.venv/bin/python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          cd .github/q24-experiment
          "$GITHUB_WORKSPACE/.venv/bin/python" run_quit_checks.py \
            "$GITHUB_WORKSPACE/.venv/bin/python" "$site" \
            "$GITHUB_WORKSPACE/frontend/src/design/brand/icon.svg" "$RUNNER_TEMP/q24"
      - name: What the merged M0 app does when it is asked to quit
        if: always()
        timeout-minutes: 8
        env:
          Q24_REAL_KEYS: "1"
        run: |
          sw_vers
          site=$(.venv/bin/python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          .github/q24-experiment/m0_check.sh "$PWD" "$PWD/.venv/bin/python" "$site" "$RUNNER_TEMP/m0"
