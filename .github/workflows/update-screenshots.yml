# Makes every screenshot of the end-to-end tests on CI and uploads them
# (docs/TESTING.md section 6). Started by hand, for a branch:
#
#   gh workflow run update-screenshots.yml --ref <branch>
#
# The images are made, not compared. Download the artifact "screenshots-made",
# put the images into e2e/tests/__screenshots__, and commit them with the pixel
# counts against the previous images (the summary of this run lists them).
#
# Actions are pinned to a commit. The comment after each one names its version.
name: Update screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep equal to UV_VERSION in ./start and in ci.yml.
  UV_VERSION: "0.13.8"
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  screenshots:
    name: Make every screenshot
    # The macOS the e2e job of ci.yml compares on: images are made where they are compared.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install packages
        run: |
          npm --prefix frontend ci
          npm --prefix e2e ci
      - name: Install browsers
        working-directory: e2e
        run: npx playwright install webkit chromium
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install ffmpeg, as the app does
        run: |
          uv sync --frozen
          uv run python -m ytmirror.tools.install_tool ffmpeg "$RUNNER_TEMP/ffmpeg-first" --source martin-riedl
      - name: Make the screenshots, and count them against the stored images
        env:
          YTM_REQUIRE_FFMPEG: "1"
          YTM_TEST_FFMPEG_DIR: ${{ runner.temp }}/ffmpeg-first/ffmpeg
          YTM_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: |
          npm --prefix e2e test -- --grep R-TH-09
          # The counts say what changed; an image over the limit is what is being updated.
          node e2e/screenshot-counts.ts "$YTM_SCREENSHOT_DIR" | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-made
          path: ${{ runner.temp }}/screenshots
          retention-days: 14
